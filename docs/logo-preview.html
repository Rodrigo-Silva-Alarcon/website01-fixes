<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Logo preview — Smart House</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f5f5f5; }
    .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; margin-bottom: 24px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    .dark { background: #191c1f; color: #fff; }
    .label { font-size: 12px; color: #666; margin-bottom: 8px; }
    .dark .label { color: #cacccd; }
    .header-logo { width: 150px; height: 50px; color: #191c1f; }
    .mobile-logo { width: 118px; height: 40px; color: #191c1f; }
    .footer-logo { width: 237px; height: 80px; color: #fff; }
    .dash-logo { height: 96px; width: auto; color: #191c1f; }
    .icon-box { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #0f172a; border-radius: 6px; color: #fff; }
    .icon-box svg { width: 20px; height: 20px; }
    svg.wordmark, svg.icon-only { display: block; height: 100%; width: 100%; }
    svg.dash { height: 96px; width: auto; }
  </style>
</head>
<body>
  <h1>Logo replacement preview (was: "Lg")</h1>

  <div class="row">
    <div class="card">
      <div class="label">Header desktop (150×50)</div>
      <div class="header-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" fill="currentColor" role="img" aria-label="Smart House" class="wordmark">
          <path d="M24 5.5 4 21.5V43h15.5V30h9v13H44V21.5L24 5.5Z"/>
          <text x="56" y="34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Smart House</text>
        </svg>
      </div>
    </div>
    <div class="card">
      <div class="label">Header mobile (118×40)</div>
      <div class="mobile-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" fill="currentColor" role="img" aria-label="Smart House" class="wordmark">
          <path d="M24 5.5 4 21.5V43h15.5V30h9v13H44V21.5L24 5.5Z"/>
          <text x="56" y="34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Smart House</text>
        </svg>
      </div>
    </div>
    <div class="card dark">
      <div class="label">Footer (237×80, white)</div>
      <div class="footer-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" fill="currentColor" role="img" aria-label="Smart House" class="wordmark">
          <path d="M24 5.5 4 21.5V43h15.5V30h9v13H44V21.5L24 5.5Z"/>
          <text x="56" y="34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Smart House</text>
        </svg>
      </div>
    </div>
    <div class="card">
      <div class="label">Dashboard (h-96px)</div>
      <div class="dash-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" fill="currentColor" role="img" aria-label="Smart House" class="dash">
          <path d="M24 5.5 4 21.5V43h15.5V30h9v13H44V21.5L24 5.5Z"/>
          <text x="56" y="34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Smart House</text>
        </svg>
      </div>
    </div>
    <div class="card">
      <div class="label">Admin sidebar icon (20×20)</div>
      <div class="icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="currentColor" role="img" aria-label="Smart House">
          <path d="M24 5.5 4 21.5V43h15.5V30h9v13H44V21.5L24 5.5Z"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
